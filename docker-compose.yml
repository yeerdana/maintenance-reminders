x-app: &app
  build: ./project
  environment: &app-env
    SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key-change-me}
    DEBUG: ${DEBUG:-1}
    POSTGRES_HOST: db
    POSTGRES_DB: reminders
    POSTGRES_USER: reminders
    POSTGRES_PASSWORD: reminders
    CELERY_BROKER_URL: redis://redis:6379/0
    REMINDER_DAYS_AHEAD: ${REMINDER_DAYS_AHEAD:-3}
    DIGEST_HOUR: ${DIGEST_HOUR:-9}
    TIME_ZONE: ${TIME_ZONE:-Asia/Almaty}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reminders
      POSTGRES_USER: reminders
      POSTGRES_PASSWORD: reminders
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reminders -d reminders"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    <<: *app
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/login/')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  celery:
    <<: *app
    command: celery -A core worker -l info
    depends_on:
      web:
        condition: service_healthy

  beat:
    <<: *app
    # The schedule file lives in /tmp so no binary state ends up in the repository.
    command: celery -A core beat -l info -s /tmp/celerybeat-schedule
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
