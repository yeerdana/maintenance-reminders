name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project/requirements.txt
      - run: pip install -r project/requirements.txt
      - name: pytest on SQLite
        working-directory: project
        run: pytest -v

  docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tests against PostgreSQL
        run: docker compose run --rm web pytest -v
      - name: Start all services
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:8000/admin/login/
      - name: Logs
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
